name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify web files
        run: |
          echo "Checking www folder..."
          ls -la
          echo "Checking www contents..."
          ls -la www
          test -f www/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sss-1-mathematics-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
