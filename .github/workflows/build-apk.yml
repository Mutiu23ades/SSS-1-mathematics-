name: Build SSS 1 Mathematics APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f style.css ]; then cp style.css www/style.css; fi
          if [ -f script.js ]; then cp script.js www/script.js; fi
          if [ -d assets ]; then cp -r assets www/; fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSS-1-Mathematics-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
